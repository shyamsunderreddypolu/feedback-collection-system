# Test profile: in-memory H2 so tests never depend on a running MySQL instance.
# Activate with @ActiveProfiles("test").
# NON_KEYWORDS=YEAR because StudentProfile maps a column called "year", which H2 reserves.
spring.datasource.url=jdbc:h2:mem:fbcs_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Must be set as a hibernate property: application.properties pins MySQLDialect there,
# and that wins over spring.jpa.database-platform.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.org.springframework.security=INFO
logging.level.com.feedback.feedbacksystem=INFO
