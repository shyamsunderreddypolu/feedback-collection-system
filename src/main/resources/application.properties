spring.application.name=feedbacksystem

# Dynamic Port Binding (Required for Railway / Cloud containers)
server.port=${PORT:8080}

# Spring MVC & Resource serving
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# MySQL Connection Details (Automatically binds to Railway environment variables or localhost fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:fbcs_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:fbcs_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Fbcspassword_2026}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security Key Configuration (256-bit base64 encoded secret key)
security.jwt.token.secret-key=${JWT_SECRET_KEY:dGhlLXNlY3JldC1rZXktZm9yLWZiY3Mtc2VjdXJpdHktc3ByaW5nLWJvb3QtYXBwbGljYXRpb24tMjAyNg==}
security.jwt.token.expire-length=86400000

# Logging Level
logging.level.root=INFO
logging.level.com.feedback.feedbacksystem=INFO
