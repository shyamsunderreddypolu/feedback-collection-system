# Production Profile Configuration
# MySQL connection details dynamically injected via environment variables:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fbcs_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fbcs_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Fbcspassword_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache templates for performance
spring.thymeleaf.cache=true

# Prod log settings
logging.level.root=WARN
logging.level.com.feedback.feedbacksystem=INFO
