# Production Profile Configuration for Railway / Cloud Deployment
server.port=${PORT:8080}

# Railway MySQL / Cloud Database Connection Configuration
# Seamlessly binds to Railway variables (MYSQLHOST, MYSQLPORT, etc.) or standard SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:fbcs_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache templates for performance
spring.thymeleaf.cache=true

# JWT Security Key
security.jwt.token.secret-key=${JWT_SECRET_KEY:dGhlLXNlY3JldC1rZXktZm9yLWZiY3Mtc2VjdXJpdHktc3ByaW5nLWJvb3QtYXBwbGljYXRpb24tMjAyNg==}
security.jwt.token.expire-length=86400000

# Logging Level
logging.level.root=WARN
logging.level.com.feedback.feedbacksystem=INFO
