# Demo profile: runs the whole application on an in-memory H2 database, so the REST API
# can be exercised without a MySQL server. Data is discarded when the process stops.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# NON_KEYWORDS=YEAR because StudentProfile maps a column called "year", which H2 reserves.
spring.datasource.url=jdbc:h2:mem:fbcs;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Overrides the MySQL dialect pinned in application.properties, which would otherwise
# emit "engine=InnoDB" and fail every create table statement on H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate must create the tables before the seed script runs.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql

# Browse the data at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:fbcs, user: sa)
spring.h2.console.enabled=true

logging.level.org.springframework.security=INFO
logging.level.com.feedback.feedbacksystem=INFO
